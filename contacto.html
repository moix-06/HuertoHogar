<main>

    <h1>Contáctanos</h1>

    <p>
        ¿Tienes alguna consulta? Envíanos un mensaje y te responderemos lo antes posible.
    </p>

    <form id="form-contacto" action="#" novalidate>

        <label for="nombre-contacto">Nombre:</label>
        <input type="text" id="nombre-contacto" name="nombre" maxlength="100" autocomplete="name" required>
        <small id="error-nombre-contacto"></small>
        <label for="correo-contacto">Correo electrónico:</label>
        <input type="email" id="correo-contacto" name="correo" maxlength="100" autocomplete="email" required>
        <small id="error-correo-contacto"></small>
        <label for="comentario-contacto">Mensaje:</label>
        <textarea id="comentario-contacto" name="comentario" maxlength="500" required></textarea>
        <small id="error-comentario-contacto"></small>
        <button type="submit">Enviar mensaje</button>

    </form>

</main>

    <footer>
        <p>HuertoHogar - Del campo al hogar.</p>
