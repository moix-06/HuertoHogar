<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Administrador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html">HuertoHogar</a>
</header>

<main>
    <h1>Mantenedor de Usuarios</h1>

    <a href="admin.html">Volver al administrador</a>

    <section>
        <h2>Usuarios registrados</h2>

        <table>
            <thead>
            <tr>
                <th>RUN</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Tipo</th>
                <th>Región</th>
                <th>Comuna</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody id="lista-usuarios">
            </tbody>
        </table>
    </section>

    <section>
        <h2>Agregar usuario</h2>

        <form id="form-usuario" novalidate>

            <label for="run">RUN</label>
            <input type="text" id="run" maxlength="9" required>

            <label for="nombre-usuario">Nombre</label>
            <input type="text" id="nombre-usuario" maxlength="50" required>

            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" maxlength="100" required>

            <label for="correo-usuario">Correo</label>
            <input type="email" id="correo-usuario" maxlength="100" required>

            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="fecha-nacimiento" required>

            <label for="tipo-usuario">Tipo de usuario</label>
            <select id="tipo-usuario" required>
                <option value="">Seleccionar tipo</option>
                <option value="Administrador">Administrador</option>
                <option value="Cliente">Cliente</option>
                <option value="Vendedor">Vendedor</option>
            </select>

            <label for="region">Región</label>
            <select id="region" required>
                <option value="">Seleccionar región</option>
            </select>

            <label for="comuna">Comuna</label>
            <select id="comuna" required>
                <option value="">Seleccionar comuna</option>
            </select>

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" maxlength="300" required>

            <button type="submit">Agregar usuario</button>

        </form>
    </section>
</main>

    <footer>
        <p>HuertoHogar - Del campo al hogar.</p>
        <p>Contacto: contacto@huertohogar.cl</p>
        <p>&copy; 2026 HuertoHogar. Proyecto academico DSY1104.</p>
    </footer>

    <script src="admin-usuarios.js"></script>

</body>
</html>
